apiVersion: v1
kind: ServiceAccount
metadata:
  name: maintenance-controller
  namespace: maintenance-lab

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: maintenance-controller-observe-and-cordon
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "update"]

  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["maintenance.studymate.io"]
    resources: ["maintenanceplans"]
    verbs: ["get", "list", "watch"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: maintenance-controller-observe-and-cordon
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: maintenance-controller-observe-and-cordon
subjects:
  - kind: ServiceAccount
    name: maintenance-controller
    namespace: maintenance-lab

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: maintenance-controller-write
  namespace: maintenance-lab
rules:
  - apiGroups: ["maintenance.studymate.io"]
    resources: ["maintenanceplans/status"]
    verbs: ["update"]

  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: maintenance-controller-write
  namespace: maintenance-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: maintenance-controller-write
subjects:
  - kind: ServiceAccount
    name: maintenance-controller
    namespace: maintenance-lab